name: Feedback pipeline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python pipeline.py demo
      - run: python pipeline.py adjudicate --task t09 --adjudicator lead --preference 0 --rationale "Test data must stay separate from model selection."
      - run: python pipeline.py quality
      - run: python pipeline.py audit
      - run: python pipeline.py export --version ci-v1
      - run: python pipeline.py verify --release exports/ci-v1
      - uses: actions/upload-artifact@v7
        with:
          name: synthetic-feedback-release
          path: |
            exports/ci-v1/
            reports/
